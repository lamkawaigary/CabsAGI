<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1E3A5F"/>
  
  <!-- Taxi body -->
  <rect x="100" y="180" width="312" height="180" rx="30" fill="#FFB800"/>
  
  <!-- Taxi roof -->
  <path d="M170 180 L180 100 L332 100 L342 180" fill="#FFB800"/>
  
  <!-- Windows -->
  <rect x="190" y="120" width="60" height="50" rx="5" fill="#1E3A5F"/>
  <rect x="260" y="120" width="60" height="50" rx="5" fill="#1E3A5F"/>
  
  <!-- Front windshield -->
  <rect x="115" y="190" width="80" height="60" rx="8" fill="#87CEEB"/>
  
  <!-- Rear windshield -->
  <rect x="317" y="190" width="80" height="60" rx="8" fill="#87CEEB"/>
  
  <!-- TAXI text -->
  <text x="256" y="290" font-family="Arial Black, sans-serif" font-size="48" font-weight="bold" fill="#1E3A5F" text-anchor="middle">TAXI</text>
  
  <!-- Wheels -->
  <circle cx="160" cy="360" r="40" fill="#333"/>
  <circle cx="160" cy="360" r="20" fill="#666"/>
  <circle cx="352" cy="360" r="40" fill="#333"/>
  <circle cx="352" cy="360" r="20" fill="#666"/>
  
  <!-- Taxi light on top -->
  <rect x="220" y="70" width="72" height="30" rx="10" fill="#FFB800"/>
  <text x="256" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F" text-anchor="middle">TAXI</text>
</svg>